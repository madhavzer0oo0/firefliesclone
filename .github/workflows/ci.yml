name: Submission checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:////tmp/fireflies-ci.db
      NEXT_PUBLIC_API_URL: http://localhost:8001/api/v1
      E2E_API_URL: http://localhost:8001/api/v1
      PLAYWRIGHT_ISOLATED_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements.lock.txt
        working-directory: backend
      - run: python -m pytest -q
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run test:unit && npm run lint && npm run typecheck && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start isolated migrated and seeded API
        working-directory: backend
        run: |
          python -m alembic upgrade head
          python -m app.seed
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8001 > /tmp/fireflies-api.log 2>&1 &
          for attempt in {1..40}; do
            if curl --fail http://localhost:8001/ready; then exit 0; fi
            sleep 1
          done
          cat /tmp/fireflies-api.log
          exit 1
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: frontend/test-results/
